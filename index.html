<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himpunan Santri Daarul 'Uluum Lido</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#2b6954' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER CARD -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- HEADER / BRANDING -->
        <div class="bg-gradient-to-br from-emerald-900 to-primary p-8 text-center text-white relative">
            <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl mx-auto p-2 border border-white/20 flex items-center justify-center mb-4 shadow-inner">
                <img src="https://assets-web-du.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2019/01/05054727/logodu.png" 
                     alt="Logo DU Lido" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl font-bold tracking-wide">HISADA SYSTEM</h1>
            <p class="text-xs text-emerald-200 mt-1">Pesantren Modern Daarul 'Uluum Lido</p>
        </div>

        <!-- FORM LOGIN MANUAL -->
        <!-- Form Login dengan Redirect Otomatis ke index.html -->
<!-- FORM DENGAN EFEK LOADING JAVASCRIPT -->
<form id="login-form" class="p-8 space-y-5">
    <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Username / Email</label>
        <input type="text" id="username" value="admin" required
               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-medium">
    </div>

    <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Password</label>
        <input type="password" id="password" value="admin" required
               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-medium">
    </div>

    <button type="submit" id="btn-submit"
            class="w-full bg-primary hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
        <span id="btn-text">Login</span>
        <span id="btn-icon" class="material-symbols-outlined text-sm">arrow_forward</span>
    </button>
</form>

<script>
    const loginForm = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah form reload langsung
        
        // Ubah tampilan tombol jadi "Memproses..."
        btnText.innerText = "Memverifikasi Akun...";
        btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
        
        // Simulasi delay 1 detik lalu redirect ke index.html
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);
    });
</script>

        <div class="bg-slate-50 border-t border-slate-100 p-4 text-center">
            <p class="text-[11px] text-slate-400">Administrasi Terpadu • Sistem Informasi HISADA</p>
        </div>
    </div>

</body>
</html>
